# CI des pull requests : lint, pytest, terraform plan, dbt Slim CI, build + scan de l'image.
# Activée à l'étape 3 (remplacer workflow_dispatch par pull_request).
name: ci
on:
  workflow_dispatch:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
