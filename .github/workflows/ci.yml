# CI : vérifie chaque pull request vers main, sans jamais modifier l'infrastructure.
#   python    ruff (lint + format) et pytest
#   secrets   recherche de secrets dans tout l'historique (gitleaks)
#   terraform fmt, validate, puis plan sur dev publié en commentaire de la pull request
# L'accès à Google Cloud passe par le pool github-plan (lecture seule), sans aucune clé.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: pip install -e ".[dev,geo]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform (fmt, validate, plan dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # jeton OIDC échangé contre l'identité tf-plan
      pull-requests: write   # publier le plan en commentaire
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_budget_currency: ${{ vars.BUDGET_CURRENCY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Format
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate (bootstrap, dev, prod)
        run: |
          for d in bootstrap envs/dev envs/prod; do
            terraform -chdir=infra/$d init -backend=false
            terraform -chdir=infra/$d validate
          done

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.TF_PLAN_SA }}

      - name: Plan dev
        id: plan
        run: |
          terraform -chdir=infra/envs/dev init -backend-config=backend.hcl
          terraform -chdir=infra/envs/dev plan -lock-timeout=120s -no-color -out=tfplan
          terraform -chdir=infra/envs/dev show -no-color tfplan > plan.txt

      - name: Publier le plan dans la pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-dev -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(résumé introuvable)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n… (plan tronqué)';
            const body = `${marker}\n### Terraform plan — dev\n\n**${summary}**\n\n<details><summary>Plan complet</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
