# CI : vérifie chaque pull request vers main, sans jamais modifier l'infrastructure.
#   python    ruff (lint + format) et pytest
#   secrets   recherche de secrets dans tout l'historique (gitleaks)
#   terraform fmt, validate, puis plan sur dev publié en commentaire de la pull request
#   dbt       build des modèles modifiés (et de leurs descendants) dans le dataset ci (Slim CI)
#   image     construction de l'image Docker du pipeline, et démarrage à vide
# L'accès à Google Cloud passe par le pool github-plan, sans aucune clé : tf-plan en lecture seule,
# sa-dbt-ci qui ne peut écrire que dans le dataset ci.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dbt_select:
        description: "Sélection dbt (ex. +fct_price_monthly pour tout reconstruire en amont)"
        default: "state:modified+"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: pip install -e ".[dev,geo]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform (fmt, validate, plan dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # jeton OIDC échangé contre l'identité tf-plan
      pull-requests: write   # publier le plan en commentaire
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
      TF_VAR_budget_currency: ${{ vars.BUDGET_CURRENCY }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Format
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate (bootstrap, dev, prod)
        run: |
          for d in bootstrap envs/dev envs/prod; do
            terraform -chdir=infra/$d init -backend=false
            terraform -chdir=infra/$d validate
          done

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.TF_PLAN_SA }}

      - name: Plan dev
        id: plan
        run: |
          terraform -chdir=infra/envs/dev init -backend-config=backend.hcl
          terraform -chdir=infra/envs/dev plan -lock-timeout=120s -no-color -out=tfplan
          terraform -chdir=infra/envs/dev show -no-color tfplan > plan.txt

      - name: Publier le plan dans la pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-dev -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(résumé introuvable)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n… (plan tronqué)';
            const body = `${marker}\n### Terraform plan — dev\n\n**${summary}**\n\n<details><summary>Plan complet</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  dbt:
    name: dbt (modèles modifiés, dataset ci)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # jeton OIDC échangé contre l'identité sa-dbt-ci
    env:
      GCP_PROJECT_ID: obs-cemac-dev-11259
      BQ_LOCATION: EU
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_SELECT: ${{ inputs.dbt_select || 'state:modified+' }}
    steps:
      - uses: actions/checkout@v7

      # L'état de référence : le projet dbt tel qu'il est sur main
      - uses: actions/checkout@v7
        with:
          ref: main
          path: reference-main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer dbt
        run: pip install -e ".[dbt]"

      # Manifeste de main, rendu avec la cible dev, sans accès à BigQuery. Il sert deux fois :
      #   - comparé à la PR, il dit quels modèles ont changé (state:modified) ;
      #   - il pointe vers silver et gold, où lire les parents inchangés (--defer).
      # Vérifié en local : la différence de dataset entre ci et dev ne fait rien paraître modifié.
      - name: Manifeste de main
        working-directory: reference-main/dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/reference-main/dbt
        run: |
          dbt deps
          dbt parse --target dev
          mkdir -p "${{ github.workspace }}/state"
          cp target/manifest.json "${{ github.workspace }}/state/"

      - name: Authentification Google Cloud (sans clé)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.DBT_CI_SA }}

      # Modèles modifiés et leurs descendants construits dans ci ; leurs parents non modifiés
      # sont lus dans dev (--defer), sans être reconstruits.
      - name: Build
        working-directory: dbt
        run: |
          dbt deps
          dbt build --target ci --select "$DBT_SELECT" --fail-fast \
            --state "${{ github.workspace }}/state" --defer 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Résumé
        if: always()
        working-directory: dbt
        run: |
          {
            echo "### dbt build — sélection \`$DBT_SELECT\`"
            echo '```'
            grep -E "Done\.|Nothing to do|ERROR|FAIL|WARN" build.log | tail -20 || echo "(pas de journal)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Le CD construit cette image après la fusion : on vérifie avant qu'elle se construit et démarre
      - name: Construire
        run: docker build -t pipeline:ci .

      - name: Démarrer sans argument (doit refuser avec le code 2)
        run: |
          set +e
          docker run --rm -e GCP_PROJECT_ID=x -e GCS_RAW_BUCKET=x pipeline:ci
          code=$?
          echo "code de sortie : $code"
          test "$code" -eq 2

      - name: Outils présents dans l'image
        run: docker run --rm --entrypoint sh pipeline:ci -c "dbt --version && python -c 'import ingestion, quality.reconcile'"
