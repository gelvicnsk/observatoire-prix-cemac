[project]
name = "observatoire-prix-cemac"
version = "0.1.0"
description = "Prix alimentaires des 6 pays de la CEMAC : ingestion, normalisation, alertes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic-settings>=2.3",
    "google-cloud-storage>=2.17",
    "google-cloud-bigquery>=3.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=3.1",
]
dbt = [
    "dbt-core>=1.12,<1.13",
    "dbt-bigquery>=1.12,<1.13",
]

[tool.setuptools.packages.find]
where = ["ingestion/src"]

[tool.pytest.ini_options]
pythonpath = ["ingestion/src", "."]
testpaths = ["ingestion/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "scripts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
