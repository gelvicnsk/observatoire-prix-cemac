name: observatoire_cemac
version: "0.1.0"
config-version: 2
profile: observatoire_cemac

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# Paramètres des alertes (étape 6), fixés par la calibration du 14 novembre 2026 (ADR-009).
# Une alerte exige un z-score ET une hausse sur 1 mois au-dessus des seuils.
vars:
  alert_reference_months: 24        # période de référence : les 24 mois qui précèdent le mois testé
  alert_min_history_months: 12      # moins de 12 mois de référence : pas d'alerte
  alert_z_threshold: 2.5            # alerte modérée : z-score >= 2,5 ...
  alert_change_1m_pct: 25           # ... et hausse sur 1 mois >= 25 %
  alert_z_strong: 3                 # alerte forte : z-score >= 3 ...
  alert_change_1m_strong_pct: 40    # ... et hausse sur 1 mois >= 40 %
  freshness_stale_months: 3         # pays actif sans nouveau relevé depuis 3 mois : signalé

models:
  observatoire_cemac:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table

seeds:
  observatoire_cemac:
    +schema: silver

data_tests:
  observatoire_cemac:
    +store_failures: false
