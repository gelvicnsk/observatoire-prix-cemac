name: observatoire_cemac
version: "0.1.0"
config-version: 2
profile: observatoire_cemac

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# Paramètres des alertes (étape 6), fixés par la calibration du 14 novembre 2026 (ADR-009).
# Une alerte exige un z-score ET une hausse sur 1 mois au-dessus des seuils.
vars:
  alert_reference_months: 24        # période de référence : les 24 mois qui précèdent le mois testé
  alert_min_history_months: 12      # moins de 12 mois de référence : pas d'alerte
  alert_z_threshold: 2.5            # alerte modérée : z-score >= 2,5 ...
  alert_change_1m_pct: 25           # ... et hausse sur 1 mois >= 25 %
  alert_z_strong: 3                 # alerte forte : z-score >= 3 ...
  alert_change_1m_strong_pct: 40    # ... et hausse sur 1 mois >= 40 %
  freshness_stale_months: 3         # pays actif sans nouveau relevé depuis 3 mois : signalé
  # Pic isolé d'un mois (ADR-013) : prix au moins 2,5 fois plus haut (ou plus bas) que le mois d'avant et
  # que le mois d'après, ces deux voisins ne s'écartant pas de plus de 50 % : ligne en quarantaine.
  spike_factor: 2.5
  spike_neighbours_max_ratio: 1.5

# Elementary remplace la matérialisation des tests pour en garder les résultats : dbt 1.8+ exige de
# l'autoriser explicitement.
flags:
  require_explicit_package_overrides_for_builtin_materializations: false

models:
  # Tables d'Elementary dans le dataset elementary, sauf en CI : la CI ne doit pas remplir l'historique
  elementary:
    +schema: elementary
    +enabled: "{{ target.name != 'ci' }}"
  observatoire_cemac:
    +persist_docs:
      relation: true
      columns: true
    # Couleurs du lineage (dbt docs) : la branche verte des données valides, la branche rouge de la
    # quarantaine (ADR-012)
    +docs:
      node_color: "#1e8e3e"
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
    quarantine:
      +schema: quarantine
      +materialized: table
      +docs:
        node_color: "#d93025"

seeds:
  observatoire_cemac:
    +schema: silver

data_tests:
  observatoire_cemac:
    +store_failures: false
