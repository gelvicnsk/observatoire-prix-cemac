# Authentification par le compte de service courant (gcloud en local,
# Workload Identity Federation dans la CI, compte du job dans Cloud Run) : aucune clé.
observatoire_cemac:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dev
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      maximum_bytes_billed: 1000000000
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: ci
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      maximum_bytes_billed: 1000000000
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: prod
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      maximum_bytes_billed: 5000000000
