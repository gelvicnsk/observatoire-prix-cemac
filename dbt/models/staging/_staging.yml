version: 2

# Le staging ne fait que renommer et typer. Les règles de validité ne sont plus des contrôles bloquants ici :
# elles sont appliquées ligne à ligne par les aiguillages int_*_checked, qui envoient les lignes refusées en
# quarantaine au lieu d'arrêter le run (ADR-012). Restent ici les tests de volume d'Elementary.

models:
  - name: stg_wfp__prices
    description: Prix du PAM (dernière version par pays), renommés et typés.
    data_tests:
      # Elementary : nombre de lignes de chaque pays comparé aux exécutions précédentes. Détecte un fichier
      # du PAM tronqué, qu'aucun contrôle de cohérence ne voit (« warn » le temps de constituer l'historique).
      - elementary.dimension_anomalies:
          arguments:
            dimensions: [country_iso3]
          config:
            severity: warn
            enabled: "{{ target.name != 'ci' }}"
    columns:
      - name: price_observation_id
        description: Clé technique (pays, marché, produit, unité, type de prix, indicateur, date).

  - name: stg_chirps__rainfall_dekads
    description: Pluie CHIRPS par unité administrative et par décade (dernière version par pays).
    data_tests:
      - elementary.dimension_anomalies:
          arguments:
            dimensions: [country_iso3]
          config:
            severity: warn
            enabled: "{{ target.name != 'ci' }}"

  - name: stg_world_bank__indicators
    description: Indicateurs annuels de la Banque mondiale (dernière version par indicateur).

  - name: stg_ecb__fx_monthly
    description: Taux EUR/USD mensuels de la BCE (dernière version).
