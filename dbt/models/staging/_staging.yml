version: 2

# Premier passage : les contrôles dont on ne connaît pas encore le résultat sur les vraies données
# sont en « warn » ; ils passeront en « error » une fois les données observées (étape 5C).

models:
  - name: stg_wfp__prices
    description: Prix du PAM (dernière version par pays), renommés et typés.
    columns:
      - name: price_observation_id
        description: Clé technique (pays, marché, produit, unité, type de prix, indicateur, date).
        data_tests:
          - not_null
          - unique:
              config: {severity: warn}
      - name: price_date
        data_tests: [not_null]
      - name: country_iso3
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('country'), field: iso3}
      - name: market_name
        data_tests: [not_null]
      - name: commodity_name
        data_tests:
          - not_null
          - relationships:   # un nouveau produit du PAM : relancer make seeds-reference
              arguments: {to: ref('commodity_mapping'), field: commodity_raw}
              config: {severity: warn}
      - name: unit_raw
        data_tests:
          - not_null
          - relationships:   # une nouvelle unité du PAM : relancer make seeds-reference
              arguments: {to: ref('unit_conversion'), field: unit_raw}
              config: {severity: warn}
      - name: price_type
        data_tests:
          - accepted_values:
              arguments: {values: ['Retail', 'Wholesale']}
              config: {severity: warn}
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments: {values: ['XAF']}
              config: {severity: warn}
      - name: price_local
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}
              config: {severity: warn}

  - name: stg_chirps__rainfall_dekads
    description: Pluie CHIRPS par unité administrative et par décade (dernière version par pays).
    data_tests:
      # un code peut être porté par deux zones du PAM (2 cas au Tchad) : la clé de la source est l'identifiant
      # de zone ; le dédoublonnage par code se fait dans int_chirps__rainfall_dekads
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [country_iso3, wfp_admin_id, dekad_start_date]}
    columns:
      - name: pcode
        data_tests: [not_null]
      - name: dekad_start_date
        data_tests: [not_null]
      - name: admin_level
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2], quote: false}
      - name: rainfall_mm
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
              config: {severity: warn}

  - name: stg_world_bank__indicators
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [country_iso3, indicator_id, year]}
    columns:
      - name: indicator_code
        data_tests: [not_null]
      - name: country_iso3
        data_tests:
          - relationships:
              arguments: {to: ref('country'), field: iso3}

  - name: stg_ecb__fx_monthly
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: usd_per_eur
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: "between 0.5 and 2"}
              config: {severity: warn}
